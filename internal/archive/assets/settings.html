<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eagent settings</title>
<style>:root{font:15px system-ui,sans-serif;color:#dedee6;background:#111318;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:1100px;margin:auto}h1{font-size:22px}p{line-height:1.6;color:#a4a8b8}input,select,textarea,button{font:inherit;color:inherit;background:#202431;border:1px solid #383d4f;border-radius:7px;padding:9px}button{cursor:pointer}input,select,textarea{width:100%}textarea{min-height:120px}label{font-weight:600;display:block;margin-bottom:8px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.field{padding:15px;background:#1a1d26;border:1px solid #333849;border-radius:10px}.field small{display:block;color:#a4a8b8;margin:8px 0;overflow-wrap:anywhere}.error{color:#ffaaaa}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #aea5ff}#search{margin:12px 0}.notice{padding:12px;background:#28243b;border-radius:8px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}details{margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<header><h1>eagent settings</h1><button id="local">Open extracted archive</button></header><p id="status">Loading the saved settings snapshot…</p><p class="notice">Project defaults affect new or resumed sessions. FinaleChat’s Save button below this page applies the exact changes it shows.</p><input id="search" placeholder="Search models, fallbacks, effort, concurrency, narration…" aria-label="Search settings"><div class="fields" id="fields"></div><p id="error" role="alert" class="error"></p><details><summary>Configuration provenance</summary><pre id="provenance"></pre></details>
<script>/* FINALE_ARTIFACT_SDK */</script><script>
"use strict";const $=id=>document.getElementById(id);let resource,editable=false,edits=new Map();const node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);return n};
function error(e){$("error").textContent=e.message||String(e)}
async function load(){try{editable=false;edits=new Map();try{const live=await finale.settings.read();resource=live.resource;editable=live.editable}catch{resource=JSON.parse(await finale.text("settings/state.json"))}$("status").textContent=`${resource.label} · ${editable?"Editing current project defaults":"Saved snapshot, read only"} · ${resource.snapshot.runtime_known?"Runtime observed":"Runtime configuration unconfirmed"}`;$("provenance").textContent=JSON.stringify(resource.snapshot.details||{},null,2);render()}catch(e){error(e)}}
function render(){const query=$("search").value.toLowerCase();$("fields").replaceChildren();for(const f of resource.descriptor.fields){if(!`${f.key} ${f.label}`.toLowerCase().includes(query))continue;const box=node("div");box.className="field";const label=node("label",f.label);label.htmlFor=f.key;box.append(label);const effective=resource.snapshot.effective[f.key],saved=resource.snapshot.saved[f.key],staged=edits.get(f.key);const value=staged?.op==="set"?staged.value:staged?.op==="unset"?undefined:saved;let input;
 if(f.schema.enum||f.schema.type==="boolean"){input=node("select");const placeholder=node("option","Inherited / unset");placeholder.value="";placeholder.disabled=true;input.append(placeholder);for(const choice of f.schema.enum||(f.schema.type==="boolean"?[true,false]:[])){const option=node("option",choice);option.value=JSON.stringify(choice);input.append(option)}input.value=value===undefined?"":JSON.stringify(value)}else{input=node(f.key==="/persona"?"textarea":"input");if(f.schema.type==="integer"||f.schema.type==="number"){input.type="number";if(f.schema.minimum!==undefined)input.min=f.schema.minimum;if(f.schema.maximum!==undefined)input.max=f.schema.maximum}input.value=value===undefined?"":typeof value==="object"?JSON.stringify(value):String(value);input.placeholder=effective===undefined?"Inherited":String(effective)}
 input.id=f.key;input.disabled=!editable||!f.writable;input.onchange=()=>{try{let value=input.value;if(input.tagName==="SELECT")value=JSON.parse(value);else if(f.schema.type==="integer"||f.schema.type==="number"){if(value==="")throw new Error("Use Inherit default to remove an override.");value=Number(value)}edits.set(f.key,{op:"set",key:f.key,value});void propose()}catch(e){error(e)}};box.append(input,node("small",`${f.source||"default"} · ${f.locked_reason||"New or resumed sessions"}${effective===undefined?"":" · Effective: "+JSON.stringify(effective)}`));if(editable&&f.writable&&f.unset){const reset=node("button","Inherit default");reset.onclick=()=>{edits.set(f.key,{op:"unset",key:f.key});void propose();render()};box.append(reset)}$("fields").append(box)}}
async function propose(){try{const p={operation:"settings.apply",schema_version:resource.descriptor.schema_version,expected_version:resource.snapshot.version,generation:resource.generation||"",edits:[...edits.values()]};await finale.settings.propose(p);$("error").textContent=""}catch(e){error(e)}}
$("search").oninput=render;$("local").onclick=()=>finale.openLocalFiles().catch(error);finale.on("local",load);finale.settings.onResult(c=>{$("status").textContent=c.status==="succeeded"?"Saved. Defaults apply to new or resumed sessions. Open the latest snapshot to continue editing.":"Command result: "+c.status});finale.ready.then(connected=>{if(connected){$("local").hidden=true;void load()}});
</script></html>
