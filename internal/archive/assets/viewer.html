<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eagent · Session explorer</title>
<style>/* EAGENT_EDITOR_STYLE */</style>
<style>
body{height:auto;min-height:100vh}header.top{height:auto;min-height:48px;flex-wrap:wrap;padding:12px 16px}h1{font-size:15px;margin:0}#status{font-size:12px;color:var(--muted);margin:4px 0 0}.saved-badge{margin-left:auto;color:var(--muted);font-size:12px}.archive-nav{display:flex;align-items:center;gap:4px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}.archive-nav button{border:0;background:none;box-shadow:none;border-radius:0;height:44px;border-bottom:2px solid transparent;color:var(--muted)}.archive-nav button[aria-pressed=true]{border-bottom-color:var(--accent);color:var(--ink)}.archive-more{flex:none}.archive-more summary{cursor:pointer;padding:8px 12px;color:var(--muted);font-size:13px}.archive-more[open]{display:contents}.archive-more[open] summary{display:none}.timeline,.archive-filters{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.timeline{font-size:12px;background:var(--panel)}.timeline input{flex:1;min-width:80px;accent-color:var(--accent)}.timeline output{font-variant-numeric:tabular-nums;color:var(--muted)}.archive-filters input{flex:1;min-width:130px}main{max-width:1280px;margin:auto;padding:16px}#pane{overflow:visible;padding:0}#pane.chat .scroll{overflow:visible}#pane.chat .col{padding-bottom:12px}#pane .filters{display:none}.muted,small{color:var(--muted)}.event,.task{padding:16px;border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel)}.stat strong{display:block;font-size:23px;margin-top:6px}.event-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12px}.event-head button{height:26px;font-size:12px}.event .body{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.table{overflow:auto}.error{color:var(--bad)}#files{display:grid;gap:8px}.attachment{display:block;max-width:100%;max-height:500px;margin:12px 0}.notice{margin:10px 16px;padding:10px 12px;background:var(--accent-soft);border-radius:8px;font-size:12px;text-align:left}#focus-notice button{margin-left:8px}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}@media(max-width:600px){main{padding:10px}.archive-filters,.timeline{padding:8px 10px}.timeline label{width:100%}.saved-badge{display:none}}
</style>
<header class="top"><div class="brand"><span class="logo">e</span><h1>eagent</h1></div><div><span class="name">Saved session</span><p id="status">Open a saved archive to explore what happened.</p></div><span class="saved-badge">Read only</span><button id="local">Open extracted archive</button></header>
<nav class="archive-nav" aria-label="Views"><button data-view="chat" aria-pressed="true">Chat</button><button data-view="tasks">Tasks</button><button data-view="events">Timeline</button><details class="archive-more"><summary>More</summary><button data-view="chat">Overview</button><button data-view="tools">Tools & processes</button><button data-view="prompts">Model conversations</button><button data-view="files">Original files</button></details></nav>
<div class="timeline"><label for="until">State at event</label><input id="until" type="range" min="1" value="1" max="1" disabled><output id="position">Latest</output><button id="latest" class="small">Latest</button></div>
<div class="archive-filters"><input id="search" class="search" type="search" placeholder="Search this session" aria-label="Search session"><select id="actor" aria-label="Actor"><option value="">All actors</option><option>user</option><option>orchestrator</option><option>task</option><option>narrator</option><option>harness</option></select><select id="task" aria-label="Task"><option value="">All tasks</option></select></div>
<p id="focus-notice" class="notice" hidden><span id="focus-label"></span><button id="reveal-focus" class="small">Find chat message</button><button id="clear-focus" class="small">Show all events</button></p><p id="display-notice" class="notice" hidden></p><main id="content" aria-live="polite"><p class="muted">This website and the original event log can be kept and opened independently of eagent.</p></main><div id="modal" class="modal hidden"></div><div id="toasts"></div>
<script>window.EagentArchive={now:()=>0,attachments:()=>document.createElement('span')};</script>
<script>/* EAGENT_SESSION_APP */</script>
<script>/* FINALE_ARTIFACT_SDK */</script>
<script>/* GO_WASM_RUNTIME */</script>
<script>
"use strict";
const $=id=>document.getElementById(id);let manifest,detail,events=[],view="overview",shown=150,replayed=false,until=Infinity,wasmReady=false,focusedSeq=0;
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n};
const button=(text,fn)=>{const b=node("button",text);b.onclick=fn;return b};
let inspectionReady=false,inspectionTimer;
function saveInspection(){if(!inspectionReady||!manifest)return;clearTimeout(inspectionTimer);inspectionTimer=setTimeout(()=>{void finale.viewState.write({format:"eagent.viewer-state/v1",session:manifest.dataset.session_id,view,focused_seq:focusedSeq,search:$("search").value,actor:$("actor").value,task:$("task").value,until:Number.isFinite(until)?until:null,shown,admin:window.EagentSessionView.state(),scroll:window.scrollY}).catch(()=>{})},120)}
function restoreInspection(saved){if(saved?.format==="eagent.viewer-state/v1"&&saved.session===manifest.dataset.session_id){if(Number.isSafeInteger(saved.focused_seq)&&events.some(e=>e.seq===saved.focused_seq))focusedSeq=saved.focused_seq;if(["overview","chat","tasks","tools","events","prompts","files"].includes(saved.view))view=saved.view;if(typeof saved.search==="string")$("search").value=saved.search.slice(0,8192);for(const key of ["actor","task"])if([...$(key).options].some(o=>o.value===saved[key]))$(key).value=saved[key];if(replayed&&Number.isSafeInteger(saved.until)&&saved.until>0&&saved.until<=Number($("until").max))setUntil(saved.until,true);shown=Number.isSafeInteger(saved.shown)?Math.max(150,Math.min(2000,saved.shown)):150;window.EagentSessionView.restore(saved.admin);render();if(Number.isFinite(saved.scroll))requestAnimationFrame(()=>window.scrollTo(0,Math.max(0,saved.scroll)))}inspectionReady=true;saveInspection()}
window.addEventListener("scroll",saveInspection,{passive:true});

function failure(e){$("status").textContent=e.message||String(e);$("status").className="error"}
function call(name,...args){const r=JSON.parse(window[name](...args));if(r.error)throw new Error(r.error);return r.result}
async function bootWasm(){
 if(wasmReady)return;const parts=[];for await(const p of finale.chunks("viewer/replay.wasm.gz"))parts.push(p);
 const compressed=new Blob(parts).stream().pipeThrough(new DecompressionStream("gzip"));const bytes=await new Response(compressed).arrayBuffer();const go=new Go();const loaded=await WebAssembly.instantiate(bytes,go.importObject);void go.run(loaded.instance);wasmReady=true;
}
async function load(){inspectionReady=false;clearTimeout(inspectionTimer);const saved=await finale.viewState.read().catch(()=>null);try{
 manifest=await finale.manifest();detail=JSON.parse(await finale.text("derived/summary.json"));events=[];until=Infinity;replayed=false;shown=150;render();$("status").textContent=`Session ${manifest.dataset.session_id} · saved through event ${manifest.dataset.last_seq} at ${new Date(manifest.captured_at).toLocaleString()}${manifest.dataset.capture_complete === false ? " · incomplete: some recorded attachments are unavailable" : ""}`;
 const logs=manifest.dataset.files||[],replayInputs=[],encoder=new TextEncoder();let bytes=0,capped=logs.length>128;for(const path of logs.slice(0,128)){let line=0,batch="";for await(const raw of finale.lines(path)){line++;bytes+=encoder.encode(raw).length+1;if(bytes>33554432||events.length>=50000){capped=true;break}batch+=raw+"\n";if(batch.length>200000){replayInputs.push({path,raw:batch});batch="";await new Promise(r=>setTimeout(r,0))}if(!raw.trim())continue;const e=JSON.parse(raw);e.source={file:path.split("/").pop(),line};events.push(e)}if(batch)replayInputs.push({path,raw:batch});if(bytes>33554432||events.length>=50000){capped=true;break}}
 $("display-notice").hidden=!capped;$("display-notice").textContent=capped?"Display limit reached (50,000 events, 32 MiB or 128 source files). Replay below covers the loaded prefix; the complete original files and captured summary remain downloadable.":"";
 const max=events.at(-1)?.seq||1;$("until").max=max;$("until").value=max;$("position").textContent=`#${max} · Latest`;
 $("task").replaceChildren(node("option","All tasks"));$("task").firstChild.value="";for(const t of detail.tasks||[]){const option=node("option",`${t.id} · ${t.title}`);option.value=t.id;$("task").append(option)}
 render();$("status").textContent+=` · ${events.length.toLocaleString()} events`;
 try{await bootWasm();call("eagentReplayReset",await finale.text("context/replay.json"));for(const input of replayInputs){call("eagentReplayAppend",input.path.split("/").pop(),input.raw);await new Promise(r=>setTimeout(r,0))}replayed=true;detail=call("eagentReplayView",0);$("until").disabled=false;render()}
 catch(e){$("display-notice").hidden=false;$("display-notice").textContent+=" Replay engine unavailable: "+e.message+". The saved summary and original events remain readable."}
 restoreInspection(saved);try{const anchor=await finale.anchor();if(anchor)focusAnchor(anchor)}catch(e){$("display-notice").hidden=false;$("display-notice").textContent+=" "+e.message} }catch(e){failure(e)}}
function filtered(){const query=$("search").value.toLowerCase(),actor=$("actor").value,task=$("task").value;return events.filter(e=>e.seq<=until&&(!focusedSeq||e.seq===focusedSeq)&&(!actor||e.actor===actor)&&(!task||e.task===task||e.data?.id===task)&&(!query||JSON.stringify(e).toLowerCase().includes(query)))}
function table(headers,rows){const wrap=node("div",undefined,"table"),t=node("table"),head=node("tr");for(const h of headers)head.append(node("th",h));t.append(head);for(const row of rows){const tr=node("tr");for(const v of row)tr.append(node("td",v??""));t.append(tr)}wrap.append(t);return wrap}
function render(){saveInspection();$("focus-notice").hidden=!focusedSeq;$("reveal-focus").hidden=!finale.connected;$("focus-label").textContent=`Selected event #${focusedSeq}.`;const root=$("content");root.replaceChildren();if(!detail)return;const chosenTask=$("task").value;$("task").replaceChildren(node("option","All tasks"));$("task").firstChild.value="";for(const t of detail.tasks||[]){const option=node("option",`${t.id} · ${t.title}`);option.value=t.id;$("task").append(option)}if([...$("task").options].some(o=>o.value===chosenTask))$("task").value=chosenTask;for(const b of document.querySelectorAll("[data-view]"))b.setAttribute("aria-pressed",String(b.dataset.view===view));
 if(["chat","tasks","events"].includes(view)){
 const pane=node("div");pane.id="pane";pane.className="pane";root.append(pane);
 const snapshotEvents=events.filter(e=>e.seq<=until);
 const selected=view==="tasks"?snapshotEvents:filtered();
 if(view==="events")root.prepend(node("p",`${selected.length.toLocaleString()} matching events`,"muted"));
 window.EagentArchive.now=()=>new Date(snapshotEvents.at(-1)?.ts||manifest.captured_at).getTime();
 window.EagentSessionView.render(pane,detail,(view==="events"?selected.slice(0,shown):selected).map(e=>({...e,file:e.source.file,line:e.source.line})),view==="events"?"timeline":view);
 if(view==="events"&&focusedSeq)pane.querySelector('tr.row')?.click();
 if(view==="events"&&selected.length>shown)root.append(button("Show more events",()=>{shown+=150;render()}));
 return}
 if(view==="overview"){
 root.append(node("h2",detail.first_message||`Session ${detail.id}`));const stats=node("div",undefined,"stats");for(const [label,value]of [["Captured state",detail.status],["Events",detail.events],["Tasks",detail.tasks?.length||0],["Input tokens",Number(detail.tokens||0).toLocaleString()],["Estimated cost",`$${Number(detail.cost_usd||0).toFixed(4)}${detail.priced?"":" (partial)"}`],["Elapsed",`${Math.round((detail.duration_s||0)/60)} min`]]){const card=node("div",label,"stat");card.append(node("strong",value));stats.append(card)}root.append(stats,node("p","State is reconstructed from the saved event log. Running processes shown here describe the captured workflow; this archive does not control them.","muted"));root.append(node("p",detail.price_basis === "catalog_at_capture" ? "Cost estimates use the rate catalog saved at capture. Historical billing and past prompt/configuration values are unknown unless recorded in the native events." : "Cost estimates use this viewer’s catalog. Historical billing and past prompt/configuration values are unknown unless recorded in the native events.","muted"));root.append(table(["Actor","Model","Calls","Input","Output","Cached","Cost estimate"],(detail.usage||[]).map(u=>[u.actor,u.model,u.calls,u.input,u.output,u.cached,`$${u.cost_usd.toFixed(4)}`])));if(detail.last_reason)root.append(node("p",detail.last_reason));if(detail.question)root.append(node("p","Pending at capture: "+JSON.stringify(detail.question),"notice"));return}
 if(view==="files"){root.append(node("p","The original JSONL records, attachments and full tool outputs are preserved. Use Download archive in FinaleChat to retain the entire website."));const list=node("div");list.id="files";for(const f of manifest.files){const item=node("div");item.append(node("strong",f.path),node("small",` · ${f.size.toLocaleString()} bytes · SHA-256 ${f.sha256}`));if(f.size<=16777216)item.append(button("Inspect",async()=>{try{const text=await finale.text(f.path);const d=node("details"),summary=node("summary","File contents");d.append(summary,node("pre",text));d.open=true;item.append(d)}catch(e){failure(e)}}));list.append(item)}root.append(list);return}
 if(view==="prompts"){root.append(node("p","These are the conversations reconstructed by eagent’s own actor-view functions. System prompt templates and runtime-only context are not inferred."));if(!replayed){root.append(node("p","Wait for the replay engine to load."));return}for(const actor of ["orchestrator","narrator","task"]){root.append(button(actor,()=>{try{const task=$("task").value;if(actor==="task"&&!task)throw new Error("Select a task first.");const pre=node("pre",JSON.stringify(call("eagentReplayConversation",actor,task,Number.isFinite(until)?until:0),null,2));root.append(pre)}catch(e){failure(e)}}))}return}
 let selected=filtered();if(view==="chat")selected=selected.filter(e=>["user.message","user.answer","narrator.message","narrator.question"].includes(e.type));if(view==="tools"){root.append(table(["Handle","Task","Command","Captured status","Exit"],(detail.procs||[]).map(p=>[p.handle,p.task,p.command,p.status,p.exit_code])));selected=selected.filter(e=>e.type==="tool.result"||e.type.startsWith("proc.")||e.data?.tool_calls?.length)}
 root.append(node("p",`${selected.length.toLocaleString()} matching events`,"muted"));for(const e of selected.slice(0,shown)){const card=node("article",undefined,"event"),head=node("div",undefined,"event-head");head.append(button(`#${e.seq}`,()=>setUntil(e.seq)),node("strong",e.type),node("span",`${e.actor||"harness"}${e.task?" · "+e.task:""}`),node("span",`${e.source.file}:${e.source.line}`),node("span",new Date(e.ts).toLocaleString()));if(finale.connected)head.append(button("Find chat message",()=>{void finale.reveal({dataset_format:manifest.dataset.format,session_id:manifest.dataset.session_id,seq:e.seq}).then(()=>{$("status").textContent="Use Show matching chat message above the viewer to return to the conversation."}).catch(failure)}));card.append(head);const text=e.data?.text||e.data?.output||e.data?.summary||e.data?.reason||e.data?.description;if(text)card.append(node("div",String(text).slice(0,14000),"body"));for(const a of e.data?.attachments||e.data?.images||[]){const path="attachments/"+String(a.path||a.name).split(/[\\/]/).pop();if(manifest.files.some(f=>f.path===path)&&String(a.content_type).startsWith("image/"))card.append(button("Show "+(a.name||"image"),async()=>{try{const parts=[];for await(const p of finale.chunks(path))parts.push(p);const img=node("img");img.className="attachment";img.alt=a.name||"Session image";const src=URL.createObjectURL(new Blob(parts,{type:a.content_type}));img.onload=()=>URL.revokeObjectURL(src);img.src=src;card.append(img)}catch(e){failure(e)}}))}const raw=node("details");raw.append(node("summary","Complete event"),node("pre",JSON.stringify(e,null,2)));card.append(raw);root.append(card)}if(selected.length>shown){const more=button("Show more events",()=>{shown+=150;render()});more.id="load-more";root.append(more)}}
function setUntil(seq,keepFocus=false){if(!replayed)return;if(!keepFocus)focusedSeq=0;until=seq;detail=call("eagentReplayView",seq);$("until").value=seq;$("position").textContent=`#${seq}`;shown=150;render()}
function focusAnchor(a){if(a.dataset_format!==manifest.dataset.format||a.session_id!==manifest.dataset.session_id)throw new Error("The selected event belongs to another session.");const found=events.find(e=>a.seq?e.seq===a.seq:a.file?e.source.file===a.file.split("/").pop()&&e.source.line===a.line:a.message_id?JSON.stringify(e).includes(a.message_id):e.id===a.event_id);if(!found)throw new Error("The selected event is not in the loaded archive prefix. It may not have been captured yet, or may exceed the display limit.");focusedSeq=found.seq;view="events";for(const key of ["search","actor","task"])$(key).value="";setUntil(found.seq,true);render()}
$("reveal-focus").onclick=()=>{void finale.reveal({dataset_format:manifest.dataset.format,session_id:manifest.dataset.session_id,seq:focusedSeq}).then(()=>{$("status").textContent="Use Show matching chat message above the viewer to return to the conversation."}).catch(failure)};
window.EagentArchive.changed=saveInspection;
window.EagentArchive.attachments=atts=>{const list=node("div",undefined,"atts");for(const a of atts){const path="attachments/"+String(a.path||a.name).split(/[\\/]/).pop();const f=manifest?.files.find(f=>f.path===path);if(!f){list.append(node("span",`${a.name||"Attachment"} · unavailable`,"muted"));continue}list.append(button(a.name||"Attachment",async()=>{try{if(!String(a.content_type).startsWith("image/")){const pre=node("pre",await finale.text(path));list.append(pre);return}const parts=[];for await(const part of finale.chunks(path))parts.push(part);const img=node("img");img.className="attachment";img.alt=a.name||"Session image";const url=URL.createObjectURL(new Blob(parts,{type:a.content_type}));img.onload=img.onerror=()=>URL.revokeObjectURL(url);img.src=url;list.append(img)}catch(e){failure(e)}}))}return list};
$("clear-focus").onclick=()=>{focusedSeq=0;render()};$("until").onchange=e=>setUntil(Number(e.target.value));$("latest").onclick=()=>{focusedSeq=0;until=Infinity;if(replayed)detail=call("eagentReplayView",0);$("until").value=$("until").max;$("position").textContent=`#${$("until").max} · Latest`;render()};for(const b of document.querySelectorAll("[data-view]"))b.onclick=()=>{view=b.dataset.view;focusedSeq=0;shown=150;render()};for(const id of ["search","actor","task"])$(id).oninput=()=>{focusedSeq=0;shown=150;render()};$("local").onclick=()=>finale.openLocalFiles().catch(failure);finale.on("local",load);finale.ready.then(connected=>{if(connected){$("local").hidden=true;void load()}});
</script></html>
