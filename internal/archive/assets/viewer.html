<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eagent · Session explorer</title>
<style>
:root{font:15px system-ui,sans-serif;color:#dedee6;background:#111318;color-scheme:dark;--muted:#a4a8b8;--line:#323644;--accent:#aea5ff}*{box-sizing:border-box}body{margin:0}header{padding:20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}h2{font-size:18px}p{line-height:1.6}button,select,input{font:inherit;background:#202431;color:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px}button{cursor:pointer}button[aria-pressed=true]{background:#4b427c}button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}a{color:var(--accent)}nav,.filters,.timeline{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.filters input{flex:1;min-width:150px}.timeline input{flex:1;min-width:120px}main{padding:20px;max-width:1200px;margin:auto}.muted,small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.stat,.event,.task{padding:16px;border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#191d27}.stat strong{display:block;font-size:23px;margin-top:6px}.event-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12px}.event-head button{padding:3px 7px;font-size:12px}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;max-height:500px;overflow:auto}details{margin-top:12px}summary{cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table{overflow:auto}.error{color:#ffaaaa}.badge{color:#b4aaff}#status{margin:0;font-size:13px}#load-more{margin:20px 0}#files{display:grid;gap:8px}.attachment{display:block;max-width:100%;max-height:500px;margin:12px 0}.notice{padding:12px;background:#26233c;border-radius:8px}.working{opacity:.65}@media(max-width:600px){header,main{padding:14px}.filters,nav,.timeline{padding:10px}.stat strong{font-size:20px}}
</style>
<header><div><h1>eagent <span class="muted">/ session explorer</span></h1><p id="status">Open a saved archive to explore what happened.</p></div><button id="local">Open extracted archive</button></header>
<nav aria-label="Views"><button data-view="overview" aria-pressed="true">Overview</button><button data-view="chat">Conversation</button><button data-view="tasks">Tasks</button><button data-view="tools">Tools & processes</button><button data-view="events">All events</button><button data-view="prompts">Model conversations</button><button data-view="files">Original files</button></nav>
<div class="timeline"><label for="until">State at event</label><input id="until" type="range" min="1" value="1" max="1" disabled><output id="position">Latest</output><button id="latest">Latest</button></div>
<div class="filters"><input id="search" type="search" placeholder="Search this session" aria-label="Search session"><select id="actor" aria-label="Actor"><option value="">All actors</option><option>user</option><option>orchestrator</option><option>task</option><option>narrator</option><option>harness</option></select><select id="task" aria-label="Task"><option value="">All tasks</option></select></div>
<main id="content" aria-live="polite"><p class="muted">This website and the original event log can be kept and opened independently of eagent.</p></main>
<script>/* FINALE_ARTIFACT_SDK */</script>
<script>/* GO_WASM_RUNTIME */</script>
<script>
"use strict";
const $=id=>document.getElementById(id);let manifest,detail,events=[],view="overview",shown=150,replayed=false,until=Infinity,wasmReady=false;
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n};
const button=(text,fn)=>{const b=node("button",text);b.onclick=fn;return b};
function failure(e){$("status").textContent=e.message||String(e);$("status").className="error"}
function call(name,...args){const r=JSON.parse(window[name](...args));if(r.error)throw new Error(r.error);return r.result}
async function bootWasm(){
 if(wasmReady)return;const parts=[];for await(const p of finale.chunks("viewer/replay.wasm.gz"))parts.push(p);
 const compressed=new Blob(parts).stream().pipeThrough(new DecompressionStream("gzip"));const bytes=await new Response(compressed).arrayBuffer();const go=new Go();const loaded=await WebAssembly.instantiate(bytes,go.importObject);void go.run(loaded.instance);wasmReady=true;
}
async function load(){try{
 manifest=await finale.manifest();detail=JSON.parse(await finale.text("derived/summary.json"));events=[];until=Infinity;replayed=false;shown=150;render();$("status").textContent=`Session ${manifest.dataset.session_id} · saved through event ${manifest.dataset.last_seq} at ${new Date(manifest.captured_at).toLocaleString()}${manifest.dataset.capture_complete === false ? " · incomplete: some recorded attachments are unavailable" : ""}`;
 const logs=manifest.dataset.files||[];for(const path of logs){let line=0;for await(const raw of finale.lines(path)){line++;if(!raw.trim())continue;const e=JSON.parse(raw);e.source={file:path.split("/").pop(),line};events.push(e)}}
 const max=events.at(-1)?.seq||1;$("until").max=max;$("until").value=max;$("position").textContent=`#${max} · Latest`;
 $("task").replaceChildren(node("option","All tasks"));$("task").firstChild.value="";for(const t of detail.tasks||[]){const option=node("option",`${t.id} · ${t.title}`);option.value=t.id;$("task").append(option)}
 render();$("status").textContent+=` · ${events.length.toLocaleString()} events`;
 try{await bootWasm();call("eagentReplayReset",await finale.text("context/replay.json"));for(const path of logs){let batch="";for await(const raw of finale.lines(path)){batch+=raw+"\n";if(batch.length>200000){call("eagentReplayAppend",path.split("/").pop(),batch);batch="";await new Promise(r=>setTimeout(r,0))}}if(batch)call("eagentReplayAppend",path.split("/").pop(),batch)}replayed=true;detail=call("eagentReplayView",0);$("until").disabled=false;render()}
 catch(e){const note=node("p","Replay engine unavailable: "+e.message+". The saved summary and original events remain readable.","notice");$("content").prepend(note)}
 }catch(e){failure(e)}}
function filtered(){const query=$("search").value.toLowerCase(),actor=$("actor").value,task=$("task").value;return events.filter(e=>e.seq<=until&&(!actor||e.actor===actor)&&(!task||e.task===task||e.data?.id===task)&&(!query||JSON.stringify(e).toLowerCase().includes(query)))}
function table(headers,rows){const wrap=node("div",undefined,"table"),t=node("table"),head=node("tr");for(const h of headers)head.append(node("th",h));t.append(head);for(const row of rows){const tr=node("tr");for(const v of row)tr.append(node("td",v??""));t.append(tr)}wrap.append(t);return wrap}
function render(){const root=$("content");root.replaceChildren();if(!detail)return;for(const b of document.querySelectorAll("[data-view]"))b.setAttribute("aria-pressed",String(b.dataset.view===view));
 if(view==="overview"){
 root.append(node("h2",detail.first_message||`Session ${detail.id}`));const stats=node("div",undefined,"stats");for(const [label,value]of [["Captured state",detail.status],["Events",detail.events],["Tasks",detail.tasks?.length||0],["Input tokens",Number(detail.tokens||0).toLocaleString()],["Estimated cost",`$${Number(detail.cost_usd||0).toFixed(4)}${detail.priced?"":" (partial)"}`],["Elapsed",`${Math.round((detail.duration_s||0)/60)} min`]]){const card=node("div",label,"stat");card.append(node("strong",value));stats.append(card)}root.append(stats,node("p","State is reconstructed from the saved event log. Running processes shown here describe the captured workflow; this archive does not control them.","muted"));root.append(node("p",detail.price_basis === "catalog_at_capture" ? "Cost estimates use the rate catalog saved at capture. Historical billing and past prompt/configuration values are unknown unless recorded in the native events." : "Cost estimates use this viewer’s catalog. Historical billing and past prompt/configuration values are unknown unless recorded in the native events.","muted"));root.append(table(["Actor","Model","Calls","Input","Output","Cached","Cost estimate"],(detail.usage||[]).map(u=>[u.actor,u.model,u.calls,u.input,u.output,u.cached,`$${u.cost_usd.toFixed(4)}`])));if(detail.last_reason)root.append(node("p",detail.last_reason));if(detail.question)root.append(node("p","Pending at capture: "+JSON.stringify(detail.question),"notice"));return}
 if(view==="tasks"){for(const task of detail.tasks||[]){const card=node("article",undefined,"task");card.append(node("h2",`${task.id} · ${task.title}`),node("p",`${task.status} · ${task.turns} turns`,"badge"),node("p",task.summary||""));card.append(button("Inspect task events",()=>{$("task").value=task.id;view="events";render()}));root.append(card)}return}
 if(view==="files"){root.append(node("p","The original JSONL records, attachments and full tool outputs are preserved. Use Download archive in FinaleChat to retain the entire website."));const list=node("div");list.id="files";for(const f of manifest.files){const item=node("div");item.append(node("strong",f.path),node("small",` · ${f.size.toLocaleString()} bytes · SHA-256 ${f.sha256}`));if(f.size<=16777216)item.append(button("Inspect",async()=>{try{const text=await finale.text(f.path);const d=node("details"),summary=node("summary","File contents");d.append(summary,node("pre",text));d.open=true;item.append(d)}catch(e){failure(e)}}));list.append(item)}root.append(list);return}
 if(view==="prompts"){root.append(node("p","These are the conversations reconstructed by eagent’s own actor-view functions. System prompt templates and runtime-only context are not inferred."));if(!replayed){root.append(node("p","Wait for the replay engine to load."));return}for(const actor of ["orchestrator","narrator","task"]){root.append(button(actor,()=>{try{const task=$("task").value;if(actor==="task"&&!task)throw new Error("Select a task first.");const pre=node("pre",JSON.stringify(call("eagentReplayConversation",actor,task),null,2));root.append(pre)}catch(e){failure(e)}}))}return}
 let selected=filtered();if(view==="chat")selected=selected.filter(e=>["user.message","user.answer","narrator.message","narrator.question"].includes(e.type));if(view==="tools"){root.append(table(["Handle","Task","Command","Captured status","Exit"],(detail.procs||[]).map(p=>[p.handle,p.task,p.command,p.status,p.exit_code])));selected=selected.filter(e=>e.type==="tool.result"||e.type.startsWith("proc.")||e.data?.tool_calls?.length)}
 root.append(node("p",`${selected.length.toLocaleString()} matching events`,"muted"));for(const e of selected.slice(0,shown)){const card=node("article",undefined,"event"),head=node("div",undefined,"event-head");head.append(button(`#${e.seq}`,()=>setUntil(e.seq)),node("strong",e.type),node("span",`${e.actor||"harness"}${e.task?" · "+e.task:""}`),node("span",`${e.source.file}:${e.source.line}`),node("span",new Date(e.ts).toLocaleString()));card.append(head);const text=e.data?.text||e.data?.output||e.data?.summary||e.data?.reason||e.data?.description;if(text)card.append(node("div",String(text).slice(0,14000),"body"));for(const a of e.data?.attachments||e.data?.images||[]){const path="attachments/"+String(a.path||a.name).split(/[\\/]/).pop();if(manifest.files.some(f=>f.path===path)&&String(a.content_type).startsWith("image/"))card.append(button("Show "+(a.name||"image"),async()=>{try{const parts=[];for await(const p of finale.chunks(path))parts.push(p);const img=node("img");img.className="attachment";img.alt=a.name||"Session image";const src=URL.createObjectURL(new Blob(parts,{type:a.content_type}));img.onload=()=>URL.revokeObjectURL(src);img.src=src;card.append(img)}catch(e){failure(e)}}))}const raw=node("details");raw.append(node("summary","Complete event"),node("pre",JSON.stringify(e,null,2)));card.append(raw);root.append(card)}if(selected.length>shown){const more=button("Show more events",()=>{shown+=150;render()});more.id="load-more";root.append(more)}}
function setUntil(seq){if(!replayed)return;until=seq;detail=call("eagentReplayView",seq);$("until").value=seq;$("position").textContent=`#${seq}`;shown=150;render()}
$("until").onchange=e=>setUntil(Number(e.target.value));$("latest").onclick=()=>{until=Infinity;if(replayed)detail=call("eagentReplayView",0);$("until").value=$("until").max;$("position").textContent=`#${$("until").max} · Latest`;render()};for(const b of document.querySelectorAll("[data-view]"))b.onclick=()=>{view=b.dataset.view;shown=150;render()};for(const id of ["search","actor","task"])$(id).oninput=()=>{shown=150;render()};$("local").onclick=()=>finale.openLocalFiles().catch(failure);finale.on("local",load);finale.ready.then(connected=>{if(connected){$("local").hidden=true;void load()}});
</script></html>
