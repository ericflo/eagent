steps:
  - name: verify
    image: docker.io/library/golang:1.24-bookworm@sha256:1a6d4452c65dea36aac2e2d606b01b4a029ec90cc1ae53890540ce6173ea77ac
    commands:
      # Steps run as an unprivileged uid with a non-writable HOME, so every
      # Go cache has to live in the tmp tree.
      - export HOME=/tmp/eagent-ci-home
      - export GOCACHE=/tmp/eagent-go-build
      - export GOMODCACHE=/tmp/eagent-go-mod
      - export GOPATH=/tmp/eagent-go
      # The clone is a metadata-free snapshot; skip redundant VCS stamping.
      - export GOFLAGS=-buildvcs=false
      - mkdir -p "$HOME" "$GOCACHE" "$GOMODCACHE" "$GOPATH"
      - |-
        set -eu
        unformatted="$$(gofmt -l .)"
        if [ -n "$${unformatted}" ]; then
          printf 'Go files require gofmt:\n%s\n' "$${unformatted}" >&2
          exit 1
        fi
      - go vet ./...
      - go test -race ./...
      - go build -o eagent ./cmd/eagent
      - ./eagent version
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
          limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile: {type: RuntimeDefault}
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}

when:
  - event: push
    evaluate: 'CI_COMMIT_BRANCH == CI_REPO_DEFAULT_BRANCH'
  - event: pull_request
