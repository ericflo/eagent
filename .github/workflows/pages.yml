name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/grid/**"
      - "scripts/*site*"
      - "scripts/site-data/**"
      - "internal/config/**"
      - "internal/llm/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/grid/**"
      - "scripts/*site*"
      - "scripts/site-data/**"
      - "internal/config/**"
      - "internal/llm/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, test, and package the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./scripts/site-data
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: ./site/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix site run check
      - run: npm --prefix site test
      - run: npm --prefix site run build
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
